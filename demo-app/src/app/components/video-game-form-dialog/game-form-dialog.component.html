<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">

    <h2>{{ gameToEdit ? 'Edit Game' : 'Add New Game' }}</h2>

    <!-- Studio row -->
    <div class="form-group">
      <label>Studio</label>

      @if (studioLocked) {
        <!-- Locked: show the studio name as read-only -->
        <div class="studio-locked">
          <span class="lock-icon" aria-hidden="true">🔒</span>
          {{ studioDisplayName }}
        </div>
      } @else {
        <!-- Admin: full dropdown -->
        <select [(ngModel)]="form.studioId" [disabled]="studios().length === 0">
          <option value="" disabled>
            {{ studios().length === 0 ? 'Loading studios…' : '— Select a Studio —' }}
          </option>
          @for (studio of studios(); track studio.id) {
            <option [value]="studio.id">{{ studio.name }}</option>
          }
        </select>
      }
    </div>

    <div class="form-group">
      <label for="game-title">Title *</label>
      <input id="game-title" type="text"
             [(ngModel)]="form.title"
             placeholder="e.g. Portal 3" />
    </div>

    <div class="form-group">
      <label for="game-price">Price ($) *</label>
      <input id="game-price" type="number"
             [(ngModel)]="form.price"
             min="0" step="0.01" />
    </div>

    <div class="form-group">
      <label for="game-cover">Cover Image URL</label>
      <input id="game-cover" type="url"
             [(ngModel)]="form.coverImageUrl"
             placeholder="https://example.com/cover.jpg" />
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" (click)="onCancel()">Cancel</button>
      <button class="btn-submit" (click)="onSubmit()">
        {{ gameToEdit ? 'Save Changes' : 'Add Game' }}
      </button>
    </div>

  </div>
</div>
