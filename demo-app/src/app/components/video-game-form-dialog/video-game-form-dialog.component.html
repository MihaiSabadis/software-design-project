<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h2>{{ gameToEdit ? 'Edit Game' : 'Add New Video Game' }}</h2>

    <div class="form-group">
      <label>Title:</label>
      <input type="text" [(ngModel)]="newGame.title" placeholder="e.g. Portal">
    </div>

    <div class="form-group">
      <label>Developer:</label>
      <input type="text" [(ngModel)]="newGame.developer" placeholder="e.g. Valve">
    </div>

    <div class="form-group">
      <label>Price ($):</label>
      <input type="number" [(ngModel)]="newGame.price" min="0" step="0.01">
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" (click)="onCancel()">Cancel</button>
      <button class="btn-submit" (click)="onSubmit()">Save Game</button>
    </div>
  </div>
</div>
