<div class="card-container">
  <div class="game-cover-container">
    <img
      [src]="game().coverImageUrl || 'https://via.placeholder.com/300x400?text=No+Cover'"
      [alt]="game().title + ' cover'"
    >
  </div>

  <div class="card-content">
    <div class="card-info">
      <h3>{{ game().title }}</h3>
      <p class="studio-name">{{ game().studio.name || 'Unknown' }}</p>
    </div>

    <div class="card-price-section">
      <span class="price-label">From</span>
      <p class="price">${{ game().price }}</p>
    </div>

    <div class="card-actions">
      <button class="btn-details" [routerLink]="['/games', game().id]">
        Details
      </button>

      @if (canManage()) {
        <button class="btn-primary" (click)="onEdit()">Edit</button>
        <button class="btn-danger"  (click)="onDelete()">Delete</button>
      }

      @if (showRemoveButton()) {
        <button
          class="btn-remove"
          (click)="onRemove()"
          [disabled]="isRemoving()"
          [attr.aria-label]="'Remove ' + game().title + ' from library'"
        >
          {{ isRemoving() ? '...' : 'Remove' }}
        </button>
      }
    </div>
  </div>
</div>
